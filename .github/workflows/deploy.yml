name: 🚀 รวมเกมเข้า Arcade
# Pages เปิดแบบ Deploy from a branch (main / root)
# workflow นี้แค่รวม games/*.json เป็น games.json แล้ว commit กลับ
on:
  push:
    branches: [main]
    paths: ["games/**", "scripts/build.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-games
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: รวมเกมทุกทีม
        run: python3 scripts/build.py --out games.json
      - name: commit games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet && exit 0
          git commit -m "อัปเดตรายชื่อเกมใน Arcade"
          git pull --rebase -q
          git push
